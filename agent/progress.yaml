    tools:
      - get_ticket_class
      - update_ticket_class
      - list_ticket_classes
      - create_discount
      - get_order
      - list_orders
      - get_attendee
    
  - name: "Phase 3: Venue & Organization"
    status: "not_started"
    priority: "medium"
    tools:
      - create_venue
      - get_venue
      - update_venue
      - list_venues
      - get_organization
